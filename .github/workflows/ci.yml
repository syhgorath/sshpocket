name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: shellcheck -x -s bash start.sh start.command sistem/*.sh sistem/Helpers/*.sh sistem/Modules/*/*.sh
      - name: Syntax check (bash -n)
        run: for f in start.sh start.command sistem/*.sh sistem/Helpers/*.sh sistem/Modules/*/*.sh; do bash -n "$f"; done
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run tests
        run: bats test
