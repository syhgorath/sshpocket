name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -x -s bash start.sh sistem/*.sh sistem/Helpers/*.sh sistem/Modules/*/*.sh
      - name: Syntax check (bash -n)
        run: for f in start.sh sistem/*.sh sistem/Helpers/*.sh sistem/Modules/*/*.sh; do bash -n "$f"; done
