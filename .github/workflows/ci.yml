name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck kur (sabit sürüm, sha256 doğrulamalı)
        run: bash scripts/ci-install-shellcheck.sh
      - name: ShellCheck
        run: shellcheck -x -s bash start.sh start.command sistem/*.sh sistem/Helpers/*.sh
      - name: Syntax check (bash -n)
        run: for f in start.sh start.command sistem/*.sh sistem/Helpers/*.sh; do bash -n "$f"; done
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run tests
        run: bats test
  # macOS (Apple Silicon, yeni macOS) + macOS'un kendi bash 3.2'si: kullanıcıların gerçek ortamı.
  # Not: Gerçek Keychain izin penceresi/Terminal burada sınanmaz (testler sahte `security` kullanır).
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ortam bilgisi
        run: |
          uname -m
          sw_vers
          PATH="/bin:$PATH" bash --version | head -1
          ssh -V
      - name: Araçları kur
        run: brew install bats-core
      - name: ShellCheck kur (sabit sürüm, sha256 doğrulamalı)
        run: bash scripts/ci-install-shellcheck.sh
      - name: ShellCheck
        run: shellcheck -x -s bash start.sh start.command sistem/*.sh sistem/Helpers/*.sh
      - name: Testler (macOS bash 3.2 ile)
        # LC_ALL=C: macOS bash 3.2 + UTF-8 yerelinde bats, Türkçe karakterli test adlarını yanlış kodlar
        # ("unknown test name"; 178 testten yalnızca 75'i çalışır). C yerelinde baytlar tutarlı kalır.
        env:
          LC_ALL: C
          LANG: C
        run: PATH="/bin:/usr/bin:$PATH" bats test
